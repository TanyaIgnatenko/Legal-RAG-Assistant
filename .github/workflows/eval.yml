name: eval

# The retrieval gate is free and deterministic: it parses the PDF, chunks it
# and runs retrieval, with no LLM call and no API key. That is what makes it
# safe to run on every pull request.

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/eval.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache the sentence-transformers encoder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/src/rag_system.py') }}
          restore-keys: hf-

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Parse smoke
        run: python -m eval.smoke.parse

      - name: Retrieval regression gate
        run: python -m eval.gate

      - name: Upload gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval/results/
          retention-days: 14
